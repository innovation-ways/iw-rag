# Guards-on overlay for the api. Points it at the guard sidecars by their
# Docker-network names — WITHOUT this overlay the endpoints fall back to
# models.yaml defaults (localhost:8003/8004), unreachable inside the container, so
# the input guard fails closed and EVERY query is rejected. The Makefile's
# api-deploy/front-deploy auto-include it via $(wildcard docker/compose.guards.yaml).
#
# NOTE: this requires the guard sidecars (`injguard`, `iw-rag-vllm-guard`) to be
# running. An environment that does NOT serve the guards should remove this file
# (or set IW_RAG__GUARDRAILS__ENABLED=false) to avoid fail-closed rejections.
# Tracked in git (2026-06-09) after the original untracked copy was lost.
services:
  api:
    environment:
      IW_RAG__GUARDRAILS__ENABLED: "true"
      IW_RAG__MODELS__GUARD_INJECTION__ENDPOINT: http://injguard:8003
      IW_RAG__MODELS__GUARD_SAFETY__ENDPOINT: http://iw-rag-vllm-guard:8004/v1
      # Guards-on VRAM budget (32 GB card shared with other projects): the Granite
      # guard holds ~7 GB, so the generator runs at --gpu-memory-utilization 0.45
      # (see compose.guards-sidecars.yaml) and its pre-check estimate drops to match.
      IW_RAG__POWER__COMPONENTS__GENERATOR__VRAM_GB: "15"
      IW_RAG__POWER__CAPACITY_MARGIN_GB: "1.5"
      IW_RAG__POWER__YIELD_FREE_GB_THRESHOLD: "1.0"
  system-control:
    environment:
      IW_RAG__POWER__COMPONENTS__GENERATOR__VRAM_GB: "15"
      IW_RAG__POWER__CAPACITY_MARGIN_GB: "1.5"
      IW_RAG__POWER__YIELD_FREE_GB_THRESHOLD: "1.0"
