# Alembic config for iw-rag. The sqlalchemy.url here is a placeholder — env.py
# resolves the real DSN from Settings (or from a url set via set_main_option,
# e.g. in tests). Migrations are authored ONLY via `make migration-pending`
# (emits down_revision="PENDING"); never `alembic revision --autogenerate`
# directly (engineering-conventions §5).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Placeholder; overridden by env.py (_resolve_url) / set_main_option.
sqlalchemy.url = postgresql+psycopg://localhost/iw_rag

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
