# Pre-commit gates for iw-rag. `rev`s are pinned at install (Q-VER); bump via
# `pre-commit autoupdate` and record back into 90-meta/tech-stack-and-versions.md.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Typed deps the src/ tree imports — keep in sync so the isolated hook
        # env type-checks the same as `make type`.
        additional_dependencies:
          - "pydantic>=2"
          - "pydantic-settings>=2"
          - "sqlalchemy[asyncio]>=2"
          - "pgvector"
          - "types-PyYAML"
          - "alembic>=1.13"
          - "httpx>=0.27"
          - "fastapi>=0.115"
          - "playwright>=1.40"
          - "numpy"            # eval/benchmark/stats.py (scipy is stub-ignored in pyproject)
          - "opentelemetry-sdk"  # observability/tracing.py (lazy-imported, typed)
        args: [--strict]
        files: ^src/iw_rag/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
