groups:
  # The exclusive generator group.  swap: true makes the activation an atomic
  # stop-then-start within the group; exclusive: true enforces the AC4
  # exactly-one-generator-resident invariant by stopping any sibling that is
  # already resident before the new one is brought up.  Infinity is
  # deliberately NOT in this group (and not in any group) so it can never be
  # stopped by a swap.
  generators:
    swap: true
    exclusive: true
    members:
      - qwen3-8b-awq
      - qwen3-14b-awq
      - qwen3-32b-awq
      - qwen3-30b-a3b-awq
      - qwen25-32b-awq
      - qwen25-14b-awq
      - llama31-8b-awq
      - hermes3-llama31-8b-awq
      - mistral-small-24b-awq
      - qwen3-8b-fp8
      - qwen3-8b-bf16
      - qwen3-14b-fp8
      - hermes3-llama31-8b-fp8
      - hermes3-llama31-8b-bf16
      # The judges share the exclusive group so a judge call in the scoring
      # phase swaps the generator out and the judge in (two-phase, single-GPU).
      - "PatronusAI/Llama-3-Patronus-Lynx-8B-Instruct"
      - "AtlaAI/Selene-1-Mini-Llama-3.1-8B"
