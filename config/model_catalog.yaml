      - --cuda-graph-sizes 1,2,4,8,16,32,64
      - --max-model-len 16384
      - --gpu-memory-utilization 0.62
      - --enable-auto-tool-choice
      - --tool-call-parser mistral
      - --port 8001

  # ===========================================================================
  # Quantization-ladder variants (added 2026-06-20).  Same BASE models as the
  # awq entries above, but FP8 (8-bit, vLLM online quant from bf16 weights) and
  # bf16 (full precision) — to isolate the quality/speed/VRAM cost of the
  # quantization scheme itself.  Compare e.g. qwen3-8b-awq vs -fp8 vs -bf16.
  # The 30B-A3B MoE is intentionally absent: fp8 (~30 GB) and bf16 (~60 GB)
  # exceed the 32 GB card once Infinity (~4 GB) is resident — only 4-bit fits.
  # Qwen3-14B has no bf16 entry for the same reason (28 GB + Infinity = 32 GB,
  # no KV headroom); fp8 (~14 GB) fits.
  # ===========================================================================

  qwen3-8b-fp8:
    id: qwen3-8b-fp8
    served_name: Qwen/Qwen3-8B
    role: generation
    quantization: fp8
    expected_vram_gb: 9.0
    max_context: 16384
    vllm_flags:
      - --quantization fp8
      - --kv-cache-dtype fp8
      - --cuda-graph-sizes 1,2,4,8,16,32,64
      - --max-model-len 16384
      - --gpu-memory-utilization 0.45
      - --enable-auto-tool-choice
      - --tool-call-parser hermes
      - --port 8001

  qwen3-8b-bf16:
    id: qwen3-8b-bf16
    served_name: Qwen/Qwen3-8B
    role: generation
    quantization: none
    expected_vram_gb: 17.0
    max_context: 16384
    vllm_flags:
      - --kv-cache-dtype fp8
      - --cuda-graph-sizes 1,2,4,8,16,32,64
      - --max-model-len 16384
      - --gpu-memory-utilization 0.70
      - --enable-auto-tool-choice
      - --tool-call-parser hermes
      - --port 8001

  qwen3-14b-fp8:
    id: qwen3-14b-fp8
    served_name: Qwen/Qwen3-14B-FP8   # pre-quantized: online fp8 from bf16 OOMs (28GB transient load) on the 32GB card
    role: generation
    quantization: fp8
    expected_vram_gb: 16.0
    max_context: 16384
