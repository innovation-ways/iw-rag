  # --- Mistral Small 24B (RISKY: mistral tokenizer/parser friction) ---
  mistral-small-24b-awq:
    id: mistral-small-24b-awq
    served_name: casperhansen/mistral-small-24b-instruct-2501-awq
    role: generation
    quantization: awq
    expected_vram_gb: 16.0
    max_context: 16384
    vllm_flags:
      - --quantization awq_marlin
