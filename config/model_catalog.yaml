  # --- Meta Llama 3.1 8B Instruct — cross-family small baseline ---
  llama31-8b-awq:
    id: llama31-8b-awq
    served_name: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
    role: generation
    quantization: awq
    expected_vram_gb: 6.0
    max_context: 16384
    vllm_flags:
