      - --kv-cache-dtype fp8
      - --cuda-graph-sizes 1,2,4,8,16,32,64
      - --max-model-len 16384
      - --gpu-memory-utilization 0.40
      - --enable-auto-tool-choice
      - --tool-call-parser llama3_json
      - --port 8001

  # --- Hermes-3-Llama-3.1-8B — Hermes-tuned Llama (tool-format reference) ---
  hermes3-llama31-8b-awq:
    id: hermes3-llama31-8b-awq
    served_name: solidrust/Hermes-3-Llama-3.1-8B-AWQ
    role: generation
    quantization: awq
    expected_vram_gb: 6.0
    max_context: 16384
