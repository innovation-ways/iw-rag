name: OSS Compliance Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  oss-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install tools
        run: |
          bash .claude/skills/iw-oss-publish/scripts/install_tools.sh

      - name: Run OSS scan
        run: |
          uv run iw oss scan --project .
