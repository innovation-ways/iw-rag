name: OSS Compliance Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  oss-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install tools
        run: |
          bash .claude/skills/iw-oss-publish/scripts/install_tools.sh

      - name: Run OSS scan
        run: |
          uv run iw oss scan --project .
