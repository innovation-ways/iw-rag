# Pinned v1 benchmark golden set (F-00096 S06).
#
# DO NOT EDIT BY HAND — this file is a frozen reference the Benchmark
# Studio compares against.  Regenerate exclusively via:
#
#     uv run python scripts/gen_benchmark_corpus.py --version v1
#
# Relevance = (source_uri, keyword): a chunk is relevant when it belongs to
# `source` AND its content contains `keyword` (case-insensitive).  Keywords
# are distinctive per doc so recall is not inflated.
dataset:
  name: benchmark-golden
  version: v1
principal_groups:
- eng
- finance
- hr
- public
queries:
- question: What is the total due on invoice INV-2026-0908?
  source: corpus://bench/finance/inv-2026-0908.md
  keyword: '26250'
  query_type: exact_match
- question: Which purchase order is on invoice INV-2026-0911?
  source: corpus://bench/finance/inv-2026-0911.md
  keyword: PO-44130
  query_type: exact_match
- question: What is the premium support cost on invoice INV-2026-0903?
  source: corpus://bench/finance/inv-2026-0903.md
  keyword: '6000'
  query_type: exact_match
- question: Which invoice references purchase order PO-44127?
  source: corpus://bench/finance/inv-2026-0908.md
  keyword: PO-44127
  query_type: exact_match
- question: What is the root cause of incident INC-2026-002?
  source: corpus://bench/eng/incidents.md
  keyword: embedder OOM
  query_type: exact_match
- question: What rate limit applies to the /v2/ingest endpoint?
  source: corpus://bench/eng/api_reference.md
